[build]
  command = "node scripts/prepare-www.mjs"
  publish = "www"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://api-maps.yandex.ru; style-src 'self' 'unsafe-inline' https://api-maps.yandex.ru https://yastatic.net; img-src 'self' data: blob: https://*.yandex.ru https://*.yandex.net https://yastatic.net; font-src 'self' data: https://yastatic.net; connect-src 'self' https://llnjgyehxsogjmwegnyf.supabase.co wss://llnjgyehxsogjmwegnyf.supabase.co https://api-maps.yandex.ru https://*.yandex.ru https://*.yandex.net; frame-src https://yandex.ru https://*.yandex.ru; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self'"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
